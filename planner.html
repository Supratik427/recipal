<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Planner – RecipePal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">RecipePal</a>
  <ul class="nav-links">
    <li><a href="index.html">Search</a></li>
    <li><a href="planner.html" class="active">Meal Planner</a></li>
    <li><a href="favourites.html">Favourites</a></li>
    <li><a href="add-recipe.html">Add Recipe</a></li>
  </ul>
</nav>

<div class="page-header">
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
    <div>
      <h1>Weekly Meal Planner</h1>
      <p style="color:var(--text2);margin-top:4px;font-size:0.9rem;">Plan your meals for the week. Click any slot to add a recipe.</p>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-outline btn-sm" onclick="if(confirm('Clear all meals?')){clearPlanner();renderPlanner();generateShoppingList();showToast('Planner cleared');}">Clear all</button>
      <button class="btn btn-green btn-sm" onclick="window.print()">🖨 Print list</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="planner-grid" id="planner-grid"></div>

  <div style="margin-top:2.5rem;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:10px;">
      <h2 class="section-title" style="margin-bottom:0;">Shopping list</h2>
      <button class="btn btn-outline btn-sm" onclick="generateShoppingList()">Refresh list</button>
    </div>
    <div class="card" style="padding:1.5rem;">
      <div id="shopping-list">
        <p style="color:var(--text3);font-size:0.9rem;">Add meals to your planner to generate a shopping list.</p>
      </div>
    </div>
  </div>
</div>

<!-- Add Meal Modal -->
<div class="modal-overlay" id="add-meal-modal">
  <div class="modal">
    <h2 id="modal-title">Add meal</h2>
    <div class="form-group">
      <label class="form-label">Search a recipe</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="meal-search-input" class="form-control" placeholder="e.g. Chicken, Pasta...">
        <button class="btn btn-primary btn-sm" onclick="searchMealsForPlanner()">Search</button>
      </div>
    </div>
    <div id="meal-search-results" style="max-height:260px;overflow-y:auto;margin-top:6px;"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/api.js"></script>
<script src="js/storage.js"></script>
<script src="js/planner.js"></script>
<script>
  function buildPlannerGrid() {
    const grid = document.getElementById('planner-grid');
    grid.innerHTML = DAYS.map(day => `
      <div class="day-col">
        <div class="day-header" id="header-${day}">${day.slice(0,3)}</div>
        ${SLOTS.map(slot => `
          <div class="meal-slot">
            <div class="meal-slot-label">${slot}</div>
            <div id="cell-${day}-${slot}">
              <div class="meal-slot-empty" onclick="openAddMealModal('${day}','${slot}')">+ Add</div>
            </div>
          </div>
        `).join('')}
      </div>
    `).join('');
  }

  document.getElementById('meal-search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchMealsForPlanner();
  });

  buildPlannerGrid();
  renderPlanner();
  generateShoppingList();
</script>
</body>
</html>
