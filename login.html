    <h2>Login</h2>

</form>
    </form>

    <h2>Signup</h2>

  <input type="email" id="signup-email" placeholder="Enter email" required>
  <input type="password" id="signup-password" placeholder="Enter password" required>

  <p id="signup-error" style="color:red;"></p>

  <button type="submit">Sign Up</button>
</form>
    </form>

</div>

    document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;

        if (password.length < 6) {
            alert("Password must be at least 6 characters");
            return;
        }

        // Save login status (optional but good)
        localStorage.setItem("user", email);

function handleLogin(event) {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const error = document.getElementById("error");

  error.textContent = "";

  if (!validateEmail(email)) {
    error.textContent = "Please enter a valid email address";
    return;
  }
  function validateEmail(email) {
  const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  return regex.test(email);
}

function validatePassword(password) {
  return password.length >= 6;
}

function handleSignup(event) {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("signup-email").value.trim();
  const password = document.getElementById("signup-password").value.trim();
  const error = document.getElementById("signup-error");

  error.textContent = "";

  if (name === "") {
    error.textContent = "Name cannot be empty";
    return;
  }

  if (!validateEmail(email)) {
    error.textContent = "Enter a valid email";
    return;
  }

  if (!validatePassword(password)) {
    error.textContent = "Password must be at least 6 characters";
    return;
  }

  // Check if user already exists
  const existingUser = JSON.parse(localStorage.getItem("user"));

  if (existingUser && existingUser.email === email) {
    error.textContent = "Email already registered";
    return;
  }

  // Save user
  const user = { name, email, password };
  localStorage.setItem("user", JSON.stringify(user));

  alert("Signup successful!");
}

  alert("Login successful (demo)");
